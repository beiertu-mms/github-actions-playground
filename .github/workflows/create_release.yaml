name: Create Release
"on":
  push:
    branches:
      - master

jobs:
  release:
    name: Release next version
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # https://conventional-changelog.js.org/presets/conventional-commits/
      - name: Install changelog-conventionalcommits
        run: |
          npm i -D conventional-changelog conventional-changelog-conventionalcommits

      - name: Get next Release
        uses: cycjimmy/semantic-release-action@v8
        id: semantic
        with:
          skip_npm_plugin: true
          semantic_version: 25.0.9
          dry_run: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_pom:
    name: Update pom versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    if: ${{ github.actor != 'dependabot[bot]' && needs.release.outputs.release_version != null }}
    env:
      release_version: ${{ needs.release.outputs.release_version }}
    steps:
      - run: echo "got new release ${{ env.release_version }}"
